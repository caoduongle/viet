[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chuviettay"
version = "2.0.0"
description = "Chữ viết tay tiếng Việt tự nhiên cho Xournal++"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "caoduongle"}
]
keywords = ["handwriting", "vietnamese", "xournalpp", "xopp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
hw-note = "chuviettay.cli:main"
hw-gui = "chuviettay.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
