[pytest]
testpaths = tests
# -ra: in lý do các test bị bỏ qua (ví dụ test giao diện khi không có màn hình)
addopts = -ra
timeout = 30
markers =
    gui: các test giao diện người dùng yêu cầu môi trường màn hình và Tk/Tcl hoạt động đầy đủ
    benchmark: các bài kiểm tra hiệu năng hoặc tải nặng cần chạy độc lập ngoài luồng kiểm tra độ phủ mã
    stress: các bài kiểm tra áp lực chạy nhiều luồng đồng thời
