name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check .

  test-core:
    name: Test Core (Ubuntu / Python 3.12)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile Python files (syntax verification)
        run: python -m compileall -q .

      - name: Run pytest with virtual display
        run: xvfb-run -a python -m pytest -vv -s --timeout=30 -m "not benchmark"

  web-client:
    name: Web Client CI (Ubuntu / Pyodide 314.0.7 & Playwright)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install pytest pytest-timeout

      - name: Test Build Web (Isolated tmp_path)
        env:
          REQUIRE_WEB_BUILD: '1'
        run: python -m pytest tests/test_build_web.py -vv --timeout=300 -p no:cacheprovider

      - name: Build Web Client Dist
        run: python scripts/build_web.py

      - name: Verify Golden Master in Pyodide
        run: node scripts/test_golden_pyodide.mjs

      - name: Run JavaScript & Browser Bridge Unit Tests
        run: |
          npm run test:unit
          npm run test:browser

      - name: Run Playwright E2E Tests on Dist
        run: npx playwright test --workers=2

  test-python-314:
    name: Test (Ubuntu / Python 3.14 Future-Proofing)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with virtual display
        run: xvfb-run -a python -m pytest -vv -s --timeout=30 -m "not benchmark"
